<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive German Map & Housing Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-color: #b3e5fc;
            --land-color: #fefae0;
            --land-border: #8d99ae;
            --neighbor-land: #edf2f4;
            --hover-fill: #6366f1;
            --active-fill: #4338ca;
            --text-dark: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--sea-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            min-height: 100vh;
        }

        .map-wrapper {
            position: relative;
            background: var(--sea-color);
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        /* SVG Map Styling */
        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hitboxes & Trigger Points */
        .state-hitbox {
            fill: var(--land-color);
            stroke: var(--land-border);
            stroke-width: 1.5;
            stroke-linejoin: round;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .state-hitbox:hover {
            fill: var(--hover-fill) !important;
            stroke: #312e81;
            stroke-width: 2.5;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        .city-trigger {
            fill: #ef4444;
            stroke: #ffffff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .city-trigger:hover {
            transform: scale(1.6);
            fill: #dc2626;
        }

        .map-label {
            font-size: 11px;
            font-weight: 700;
            fill: #334155;
            pointer-events: none;
            user-select: none;
        }

        .water-label {
            font-size: 13px;
            font-style: italic;
            font-weight: 700;
            fill: #0284c7;
            letter-spacing: 1.5px;
        }

        .country-label {
            font-size: 14px;
            font-weight: 800;
            fill: #64748b;
            letter-spacing: 2px;
        }

        /* Floating Info Card */
        .info-card {
            margin-top: 20px;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card h3 { font-size: 20px; font-weight: 800; color: #0f172a; }
        .info-card p { font-size: 14px; color: #64748b; font-weight: 600; }

        .btn-action {
            background: #4f46e5;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-action:hover { background: #4338ca; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 16px; color: #0f172a; font-weight: 800;">🇩🇪 Interactive German States & Hitbox Map</h2>

    <div class="map-wrapper">
        <svg viewBox="0 0 700 850">
            <!-- Sea Background Labels -->
            <text x="120" y="80" class="water-label">NORTH SEA</text>
            <text x="500" y="80" class="water-label">BALTIC SEA</text>

            <!-- Neighboring Countries Hitboxes/Outlines -->
            <path d="M0 0 L220 0 L200 120 L0 150 Z" fill="#e2e8f0" stroke="#cbd5e1" />
            <text x="70" y="70" class="country-label">DENMARK</text>

            <path d="M0 150 L140 130 L110 380 L0 420 Z" fill="#e2e8f0" stroke="#cbd5e1" />
            <text x="10" y="270" class="country-label">NETHERLANDS</text>

            <path d="M520 150 L700 150 L700 480 L540 450 Z" fill="#e2e8f0" stroke="#cbd5e1" />
            <text x="580" y="320" class="country-label">POLAND</text>

            <path d="M540 450 L700 480 L700 700 L500 680 Z" fill="#e2e8f0" stroke="#cbd5e1" />
            <text x="560" y="550" class="country-label">CZECH REP.</text>

            <path d="M480 680 L700 700 L700 850 L380 850 Z" fill="#e2e8f0" stroke="#cbd5e1" />
            <text x="520" y="760" class="country-label">AUSTRIA</text>

            <!-- GERMAN BUNDESLÄNDER HITBOX TRIGGER PATHS -->
            <g id="statesGroup">
                <!-- 1. Schleswig-Holstein -->
                <path id="DE-SH" class="state-hitbox" d="M220 50 L340 60 L330 150 L230 140 Z" onclick="selectState('Schleswig-Holstein', 'Kiel', '400€ - 650€')" />
                <text x="240" y="100" class="map-label">Schleswig-Holstein</text>

                <!-- 2. Lower Saxony (Niedersachsen) -->
                <path id="DE-NI" class="state-hitbox" d="M140 180 L350 160 L380 300 L200 340 L120 280 Z" onclick="selectState('Lower Saxony', 'Hanover', '380€ - 620€')" />
                <text x="200" y="240" class="map-label">Lower Saxony</text>

                <!-- 3. Mecklenburg-Vorpommern -->
                <path id="DE-MV" class="state-hitbox" d="M340 60 L520 80 L500 180 L350 160 Z" onclick="selectState('Mecklenburg-Vorpommern', 'Schwerin', '320€ - 500€')" />
                <text x="370" y="120" class="map-label">Mecklenburg-Vorpommern</text>

                <!-- 4. North Rhine-Westphalia (NRW) -->
                <path id="DE-NW" class="state-hitbox" d="M110 330 L220 320 L250 460 L130 450 Z" onclick="selectState('North Rhine-Westphalia', 'Düsseldorf', '450€ - 850€')" />
                <text x="130" y="390" class="map-label">North Rhine-Westphalia</text>

                <!-- 5. Brandenburg -->
                <path id="DE-BB" class="state-hitbox" d="M380 180 L520 180 L540 350 L400 340 Z" onclick="selectState('Brandenburg', 'Potsdam', '350€ - 580€')" />
                <text x="430" y="250" class="map-label">Brandenburg</text>

                <!-- 6. Berlin (Hitbox) -->
                <rect id="DE-BE" x="450" y="240" width="30" height="25" rx="4" class="state-hitbox" style="fill:#f87171;" onclick="selectState('Berlin', 'Berlin Capital', '550€ - 950€')" />
                <text x="445" y="232" class="map-label" style="fill:#dc2626; font-weight:800;">BERLIN</text>

                <!-- 7. Hesse (Hessen) -->
                <path id="DE-HE" class="state-hitbox" d="M220 420 L310 400 L320 550 L230 540 Z" onclick="selectState('Hesse', 'Wiesbaden / Frankfurt', '500€ - 900€')" />
                <text x="250" y="470" class="map-label">Hesse</text>

                <!-- 8. Saxony (Sachsen) -->
                <path id="DE-SN" class="state-hitbox" d="M410 340 L540 350 L520 450 L390 420 Z" onclick="selectState('Saxony', 'Dresden', '300€ - 520€')" />
                <text x="440" y="380" class="map-label">Saxony</text>

                <!-- 9. Bavaria (Bayern) -->
                <path id="DE-BY" class="state-hitbox" d="M300 550 L500 520 L480 780 L280 750 Z" onclick="selectState('Bavaria', 'Munich', '600€ - 1100€')" />
                <text x="360" y="650" class="map-label" style="font-size:16px;">Bavaria</text>

                <!-- 10. Baden-Württemberg -->
                <path id="DE-BW" class="state-hitbox" d="M170 570 L290 560 L270 760 L160 720 Z" onclick="selectState('Baden-Württemberg', 'Stuttgart', '520€ - 920€')" />
                <text x="180" y="640" class="map-label">Baden-Württemberg</text>
            </g>

            <!-- CITY TRIGGER POINTS (Hotspot Buttons) -->
            <!-- Berlin Trigger -->
            <circle cx="465" cy="252" r="5" class="city-trigger" onclick="selectState('Berlin City', 'Berlin', '600€ - 1000€')" />
            
            <!-- Munich Trigger -->
            <circle cx="410" cy="720" r="6" class="city-trigger" onclick="selectState('Munich (München)', 'Bavaria', '650€ - 1200€')" />
            
            <!-- Hamburg Trigger -->
            <circle cx="280" cy="150" r="6" class="city-trigger" onclick="selectState('Hamburg State', 'Hamburg', '500€ - 900€')" />
            
            <!-- Frankfurt Trigger -->
            <circle cx="260" cy="490" r="5" class="city-trigger" onclick="selectState('Frankfurt am Main', 'Hesse', '550€ - 950€')" />
        </svg>
    </div>

    <!-- Active Hitbox Output Card -->
    <div class="info-card" id="infoCard">
        <div>
            <h3 id="selectedName">Click any State or City Trigger</h3>
            <p id="selectedDetails">Select a region on the map above to view local student housing rates.</p>
        </div>
        <button class="btn-action" onclick="alert('Opening state dorm listings...')">View Dorms</button>
    </div>

    <script>
        function selectState(name, capital, priceRange) {
            document.getElementById('selectedName').innerText = name + " (" + capital + ")";
            document.getElementById('selectedDetails').innerText = "Average Monthly Student Rent: " + priceRange;
        }
    </script>
</body>
</html>
