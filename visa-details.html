<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germany Student Visa - Comprehensive Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #cbd5e1;
            --card-bg: #ffffff;
            --brand-primary: #4f46e5;
            --brand-hover: #4338ca;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .back-btn:hover { text-decoration: underline; }

        .guide-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .guide-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-box h3 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .step-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .step-num {
            background: var(--brand-primary);
            color: white;
            font-weight: 800;
            font-size: 12px;
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }

        .info-table th, .info-table td {
            padding: 10px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .info-table th { background: #e0e7ff; color: #3730a3; font-weight: 800; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card { padding: 18px; border-radius: 16px; }
            .guide-title { font-size: 20px; flex-wrap: wrap; }
            .guide-subtitle { font-size: 13px; margin-bottom: 16px; }
            .section-box { padding: 14px; }
            .section-box h3 { font-size: 15px; }
            .step-item { font-size: 13px; }
            .info-table th, .info-table td { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <a href="visa.html" class="back-btn">← Back to Overview</a>
            <div id="contentArea">
                <!-- Content injected dynamically via JavaScript based on URL query parameter -->
            </div>
        </div>
    </div>

    <script>
        const moduleDetails = {
            "blocked-account": {
                title: "💰 Blocked Account (Sperrkonto) Guide",
                subtitle: "Detailed breakdown of financial proof requirements for standard German student visas.",
                sections: [
                    {
                        heading: "Key Statutory Requirements",
                        content: `
                            <ul class="step-list">
                                <li class="step-item"><span class="step-num">1</span><div><strong>Mandatory Amount:</strong> Minimum required standard deposit of €11,904 per year (€992 per month).</div></li>
                                <li class="step-item"><span class="step-num">2</span><div><strong>Monthly Payout:</strong> Once in Germany, €992 is unfrozen and transferred automatically to your local German bank account each month.</div></li>
                                <li class="step-item"><span class="step-num">3</span><div><strong>Buffer Deposit:</strong> Most digital providers require a one-time setup fee (~€50–€89) plus a safety buffer (~€100) returned upon closing.</div></li>
                            </ul>
                        `
                    },
                    {
                        heading: "Approved Sperrkonto Providers Comparison",
                        content: `
                            <div class="table-responsive">
                                <table class="info-table">
                                    <thead>
                                        <tr>
                                            <th>Provider</th>
                                            <th>Setup Fee</th>
                                            <th>Monthly Fee</th>
                                            <th>Features</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><strong>Expatrio</strong></td>
                                            <td>€89</td>
                                            <td>€5</td>
                                            <td>Includes free health insurance package & fast digital approval.</td>
                                        </tr>
                                        <tr>
                                            <td><strong>Fintiba</strong></td>
                                            <td>€89</td>
                                            <td>€4.90</td>
                                            <td>Mobile app integration, widely accepted by all embassies.</td>
                                        </tr>
                                        <tr>
                                            <td><strong>Coracle</strong></td>
                                            <td>€59</td>
                                            <td>€0</td>
                                            <td>No monthly fee model available with bundle options.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        `
                    }
                ]
            },
            "health-insurance": {
                title: "🏥 Health Insurance (Krankenversicherung) Guide",
                subtitle: "Navigating mandatory health insurance requirements for university enrollment and visa issuance.",
                sections: [
                    {
                        heading: "Public vs. Private Coverage",
                        content: `
                            <ul class="step-list">
                                <li class="step-item"><span class="step-num">1</span><div><strong>Statutory Public Insurance (Gesetzliche Krankenversicherung):</strong> Mandatory for students under 30 years old enrolled in degree programs. Premium is ~€120–€130/month (TK, AOK, Barmer).</div></li>
                                <li class="step-item"><span class="step-num">2</span><div><strong>Incoming Travel / Private Insurance:</strong> Required to cover your initial entry period (1–3 months) before official university enrollment begins.</div></li>
                            </ul>
                        `
                    }
                ]
            },
            "embassy-checklist": {
                title: "📄 Embassy Visa Application Checklist",
                subtitle: "Step-by-step documentation required for your student visa interview at the embassy.",
                sections: [
                    {
                        heading: "Required Document Stack",
                        content: `
                            <ul class="step-list">
                                <li class="step-item"><span class="step-num">1</span><div><strong>Valid Passport:</strong> At least 2 blank pages, valid for 12+ months.</div></li>
                                <li class="step-item"><span class="step-num">2</span><div><strong>University Admission Letter (Zulassungsbescheid):</strong> Official acceptance from a recognized German university.</div></li>
                                <li class="step-item"><span class="step-num">3</span><div><strong>Proof of Funds:</strong> Blocked account confirmation statement (Sperrbescheinigung).</div></li>
                                <li class="step-item"><span class="step-num">4</span><div><strong>Motivation Letter & CV:</strong> Well-structured explanation of your academic goals in Germany.</div></li>
                                <li class="step-item"><span class="step-num">5</span><div><strong>Consular Fee:</strong> €75 paid at the embassy during appointment.</div></li>
                            </ul>
                        `
                    }
                ]
            },
            "post-arrival": {
                title: "🏘️ Post-Arrival Execution Guide",
                subtitle: "Critical bureaucratic steps to complete during your first 14 days in Germany.",
                sections: [
                    {
                        heading: "First 14 Days Checklist",
                        content: `
                            <ul class="step-list">
                                <li class="step-item"><span class="step-num">1</span><div><strong>City Registration (Anmeldung):</strong> Register your residential address at the local Resident's Registration Office (Bürgeramt) within 14 days.</div></li>
                                <li class="step-item"><span class="step-num">2</span><div><strong>Local Bank Account:</strong> Open a current account (Girokonto) with N26, Commerzbank, or Sparkasse to unblock your monthly payout.</div></li>
                                <li class="step-item"><span class="step-num">3</span><div><strong>Residence Permit (Aufenthaltstitel):</strong> Book an appointment at the Immigration Office (Ausländerbehörde) to convert your national entry visa into a multi-year student residence permit.</div></li>
                            </ul>
                        `
                    }
                ]
            }
        };

        function renderContent() {
            const params = new URLSearchParams(window.location.search);
            const moduleKey = params.get('module') || 'blocked-account';
            const data = moduleDetails[moduleKey] || moduleDetails['blocked-account'];

            let html = `
                <div class="guide-title">${data.title}</div>
                <div class="guide-subtitle">${data.subtitle}</div>
            `;

            data.sections.forEach(sec => {
                html += `
                    <div class="section-box">
                        <h3>${sec.heading}</h3>
                        ${sec.content}
                    </div>
                `;
            });

            document.getElementById('contentArea').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderContent);
    </script>
</body>
</html>
