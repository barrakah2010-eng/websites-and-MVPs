<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Portal Login — Guide to Germany</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --bg-surface: #ffffff;
            --bg-muted: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --brand-primary: #4f46e5;
            --brand-hover: #4338ca;
            --border-color: #e2e8f0;
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(
                rgba(248, 250, 252, 0.35), 
                rgba(248, 250, 252, 0.35)
            ), url('https://images.unsplash.com/photo-1599946347371-68eb71b16afc?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
        }

        .back-link {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 24px;
        }

        .login-header { margin-bottom: 24px; }
        .login-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .login-header p { font-size: 14px; color: var(--text-secondary); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
            background: #ffffff;
        }
        .form-group input:focus { border-color: var(--brand-primary); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover { background: var(--brand-hover); }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="back-link">&larr; Return to Dashboard</a>
        <div class="login-header">
            <h1>Member Access</h1>
            <p>Log in or sign up to access your saved university listings and relocation documents.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="btn-submit">Sign In / Register</button>
        </form>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyZFvDYKw1wikerlF_HX_q_gQdXoPvhyI",
            authDomain: "your-guide-to-germany.firebaseapp.com",
            databaseURL: "https://your-guide-to-germany-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "your-guide-to-germany",
            storageBucket: "your-guide-to-germany.firebasestorage.app",
            messagingSenderId: "1029641813508",
            appId: "1:1029641813508:web:32c3a975f76bee69437f51"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('loginForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();

            push(ref(db, 'subscribers'), {
                username: username,
                email: email,
                timestamp: Date.now()
            }).then(() => {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                localStorage.setItem('userEmail', email);

                statusMsg.style.color = '#10b981';
                statusMsg.innerText = 'Login successful! Redirecting...';
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }).catch((err) => {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = 'Error: ' + err.message;
            });
        });
    </script>
</body>
</html>
